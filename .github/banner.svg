<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hotspot-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="0" fill="url(#bg)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.08">
    <circle cx="50" cy="50" r="1.5" fill="#94a3b8"/>
    <circle cx="90" cy="50" r="1.5" fill="#94a3b8"/>
    <circle cx="130" cy="50" r="1.5" fill="#94a3b8"/>
    <circle cx="50" cy="90" r="1.5" fill="#94a3b8"/>
    <circle cx="90" cy="90" r="1.5" fill="#94a3b8"/>
    <circle cx="130" cy="90" r="1.5" fill="#94a3b8"/>
    <circle cx="50" cy="130" r="1.5" fill="#94a3b8"/>
    <circle cx="90" cy="130" r="1.5" fill="#94a3b8"/>
    <circle cx="130" cy="130" r="1.5" fill="#94a3b8"/>
    <circle cx="1070" cy="170" r="1.5" fill="#94a3b8"/>
    <circle cx="1110" cy="170" r="1.5" fill="#94a3b8"/>
    <circle cx="1150" cy="170" r="1.5" fill="#94a3b8"/>
    <circle cx="1070" cy="210" r="1.5" fill="#94a3b8"/>
    <circle cx="1110" cy="210" r="1.5" fill="#94a3b8"/>
    <circle cx="1150" cy="210" r="1.5" fill="#94a3b8"/>
    <circle cx="1070" cy="250" r="1.5" fill="#94a3b8"/>
    <circle cx="1110" cy="250" r="1.5" fill="#94a3b8"/>
    <circle cx="1150" cy="250" r="1.5" fill="#94a3b8"/>
  </g>

  <!-- Icon: image with hotspot -->
  <g transform="translate(340, 90)">
    <!-- Image frame -->
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Mountain scene -->
    <polygon points="15,75 40,35 65,75" fill="#334155"/>
    <polygon points="50,75 80,45 105,75" fill="#475569"/>
    <!-- Sun -->
    <circle cx="90" cy="25" r="10" fill="#fbbf24" opacity="0.6"/>
    <!-- Hotspot overlay -->
    <rect x="55" y="15" width="45" height="35" rx="4" fill="url(#hotspot-fill)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Cursor -->
    <g transform="translate(82, 38)">
      <path d="M0,0 L0,16 L4.5,12 L8,19 L11,17.5 L7.5,11 L13,11 Z" fill="white" opacity="0.9"/>
    </g>
  </g>

  <!-- Title -->
  <text x="500" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="-1">clickable-img</text>

  <!-- Subtitle -->
  <text x="500" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">Embed clickable hotspots into PNG images</text>

  <!-- Platform tags -->
  <g transform="translate(500, 190)">
    <rect x="0" y="0" width="60" height="26" rx="13" fill="#1e3a5f"/>
    <text x="30" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Web</text>

    <rect x="72" y="0" width="72" height="26" rx="13" fill="#1e3a5f"/>
    <text x="108" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">UniApp</text>

    <rect x="156" y="0" width="72" height="26" rx="13" fill="#1e3a5f"/>
    <text x="192" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">WeChat</text>

    <rect x="240" y="0" width="100" height="26" rx="13" fill="#1e3a5f"/>
    <text x="290" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Cross-platform</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>
</svg>
